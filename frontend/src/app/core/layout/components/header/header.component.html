<header class="app-header">
  <!-- Lado Izquierdo: Logo HosPal + Chip informativo de Sede -->
  <div class="header-left">
    <button type="button" class="menu-toggle" aria-label="Abrir menú" aria-controls="app-sidebar"
      [attr.aria-expanded]="layout.sidebarOpen()" (click)="layout.toggleSidebar()">
      <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
    </button>

    <div class="brand-box">
      <img src="assets/icon/PMSwhite.png" class="brand-icon" alt="HosPal logo" />
      <div class="brand-text">
        <h2>HosPal</h2>
        <span>GESTIÓN DE HOSTALES</span>
      </div>
    </div>

    <button type="button" class="sede-chip-info" (click)="toggleSedeOptions()"
      [attr.aria-expanded]="canChangeSede() ? sedeOptionsOpen() : null"
      [attr.aria-haspopup]="canChangeSede() ? 'menu' : null"
      [attr.aria-label]="sedeInfoLabel() + (canChangeSede() ? '. Cambiar sede' : '')"
      [style.cursor]="canChangeSede() ? null : 'default'">
      <ion-icon name="business-outline" class="sede-icon"></ion-icon>
      <span class="sede-name">{{ sedeInfoLabel() }}</span>
      @if (canChangeSede()) {
        <ion-icon name="chevron-down-outline" class="sede-chevron" aria-hidden="true"></ion-icon>
      }
    </button>

    <!-- Reloj y fecha en vivo -->
    <app-clock></app-clock>
  </div>

  <!-- Lado Derecho: Acciones -->
  <div class="header-right">
    @if (alertas.enabled()) {
      <button type="button" class="notif-btn" [class.active]="alertasOpen()"
        [attr.aria-label]="'Alertas (' + alertas.count() + ')'" aria-haspopup="dialog"
        [attr.aria-expanded]="alertasOpen()" (click)="toggleAlertas()">
        <ion-icon name="notifications-outline"></ion-icon>
        @if (alertas.count() > 0) {
          <span class="notif-badge" [class.alta]="alertas.hasHigh()">{{ alertas.count() > 99 ? '99+' : alertas.count() }}</span>
        }
      </button>
    }

    <button type="button" class="config-btn" [class.active]="configOptionsOpen()" aria-label="Opciones"
      (click)="configOptions()">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
  </div>
</header>

@if (sedeOptionsOpen()) {
  <div class="sede-dropdown-backdrop" (click)="closeSedeOptions()"></div>
  <aside class="sede-dropdown-tab" role="menu" aria-label="Opciones de sede">
    <button type="button" class="sede-action-btn" role="menuitem" (click)="changeSede()">
      <div class="sede-action-icon">
        <ion-icon name="business-outline"></ion-icon>
      </div>
      <span>Cambiar sede</span>
    </button>
  </aside>
}

@if (alertasOpen()) {
  <app-alertas-panel (closed)="closeAlertas()"></app-alertas-panel>
}

@if (configOptionsOpen()) {
  <app-config-options
    (closed)="closeConfigOptions()"
    (manageProfiles)="openEditPerfiles()"
    (posConfig)="openPosConfig()"
  ></app-config-options>
}

<app-edit-perfiles [isOpen]="editPerfilesOpen()" (closed)="closeEditPerfiles()">
</app-edit-perfiles>

<app-pos-config-modal [isOpen]="posConfigOpen()" (closed)="closePosConfig()">
</app-pos-config-modal>
