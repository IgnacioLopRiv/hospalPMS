<header class="app-header">
  <!-- Lado Izquierdo: Logo HosPal + Chip de Sede -->
  <div class="header-left">
    <div class="brand-box">
      <ion-icon name="business-outline" class="brand-icon"></ion-icon>
      <div class="brand-text">
        <h2>HosPal</h2>
        <span>GESTIÓN DE HOSTALES</span>
      </div>
    </div>

    <button type="button" class="sede-chip" [class.clickable]="canEditSede()" [disabled]="!canEditSede()"
      aria-label="Editar configuración de la sede" (click)="openEditSede()">
      <ion-icon name="business-outline" class="sede-icon"></ion-icon>
      <span class="sede-name">{{ hasSede() ? sedeLabel() : 'Panel de Administración' }}</span>
      @if (canEditSede()) {
      <small class="edit-hint">(Editar)</small>
      }
    </button>
  </div>

  <!-- Lado Derecho: Acciones -->
  <div class="header-right">
    <button type="button" class="notif-btn" aria-label="Notificaciones">
      <ion-icon name="notifications-outline"></ion-icon>
    </button>

    <button type="button" class="config-btn" [class.active]="configOptionsOpen()" aria-label="Opciones" (click)="configOptions()">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
  </div>
</header>

@if (configOptionsOpen()) {
  <app-config-options (close)="closeConfigOptions()"></app-config-options>
}

<app-edit-sede-banner [isOpen]="editSedeOpen()" (closed)="closeEditSede()" (close)="closeEditSede()">
</app-edit-sede-banner>
