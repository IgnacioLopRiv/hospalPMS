<ion-content [fullscreen]="true" class="home-content">
  <div class="home-container">
    <h1>Nueva contraseña</h1>
    <p class="subtitle">Define una nueva contraseña para tu cuenta.</p>

    <div class="auth-form">
      <ion-item lines="none">
        <ion-input
          label="Nueva contraseña"
          labelPlacement="stacked"
          type="password"
          [(ngModel)]="password"
        ></ion-input>
      </ion-item>
      <ion-item lines="none">
        <ion-input
          label="Confirmar contraseña"
          labelPlacement="stacked"
          type="password"
          [(ngModel)]="confirmPassword"
        ></ion-input>
      </ion-item>

      @if (message) {
        <p [class]="success ? 'success' : 'error'">{{ message }}</p>
      }

      <ion-button expand="block" [disabled]="submitting" (click)="savePassword()">
        Guardar contraseña
      </ion-button>
      <ion-button expand="block" fill="outline" routerLink="/home">Volver al ingreso</ion-button>
    </div>
  </div>
</ion-content>
