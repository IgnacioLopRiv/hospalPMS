<ion-content [fullscreen]="true" class="home-content">
  <div class="home-container">
    <h1>Recuperar contraseña</h1>
    <p class="subtitle">
      Ingresa el correo de tu cuenta. Si está registrado, se enviará un enlace de recuperación.
    </p>

    <div class="auth-form">
      <ion-item lines="none">
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          type="email"
          placeholder="correo@ejemplo.com"
          [(ngModel)]="email"
        ></ion-input>
      </ion-item>

      @if (message) {
        <p [class]="success ? 'success' : 'error'">{{ message }}</p>
      }

      <ion-button expand="block" [disabled]="submitting" (click)="sendRecovery()">
        Enviar correo de recuperación
      </ion-button>
      <ion-button expand="block" fill="outline" routerLink="/home">Volver al ingreso</ion-button>
    </div>
  </div>
</ion-content>
