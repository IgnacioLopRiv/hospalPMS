<div class="room-picker">
  <button
    type="button"
    class="room-picker-trigger"
    [class.is-open]="open"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown.escape)="close($event)">
    @if (selected; as room) {
      <span class="room-dot" [style.background]="typologyOf(room)?.color || '#64748b'" aria-hidden="true"></span>
      <span class="room-number">Hab. {{ room.numero_habitacion }}</span>
      <span class="room-typology">{{ typologyOf(room)?.nombre }}</span>
      @if (typologyOf(room); as typology) {
        <span class="room-capacity"><ion-icon name="person-outline" aria-hidden="true"></ion-icon>{{ typology.capacidad }}</span>
      }
    } @else {
      <span class="room-placeholder">{{ placeholder }}</span>
    }
    <ion-icon class="room-chevron" name="chevron-down-outline" aria-hidden="true"></ion-icon>
  </button>
  @if (open) {
    <div class="room-options" role="listbox" aria-label="Habitaciones" [style]="listStyle">
      @for (room of rooms; track room.id_habitacion) {
        <button
          type="button"
          class="room-option"
          role="option"
          [class.selected]="isSelected(room)"
          [attr.aria-selected]="isSelected(room)"
          (click)="select(room)"
          (keydown.escape)="close($event)">
          <span class="room-dot" [style.background]="typologyOf(room)?.color || '#64748b'" aria-hidden="true"></span>
          <span class="room-number">Hab. {{ room.numero_habitacion }}</span>
          <span class="room-typology">{{ typologyOf(room)?.nombre }}</span>
          @if (typologyOf(room); as typology) {
            <span class="room-capacity"><ion-icon name="person-outline" aria-hidden="true"></ion-icon>{{ typology.capacidad }}</span>
          }
        </button>
      }
    </div>
  }
</div>
