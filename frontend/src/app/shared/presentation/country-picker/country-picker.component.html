<div class="country-picker">
  <button
    type="button"
    class="country-picker-trigger"
    [attr.aria-label]="ariaLabel"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    (click)="toggleOptions()">
    @if (selectedCountry; as country) {
    <img [src]="'https://flagcdn.com/24x18/' + country.code.toLowerCase() + '.png'" [alt]="country.countryName" class="flag-icon" />
    <span>{{ mode === 'callingCode' ? country.callingCode : country.countryName }}</span>
    } @else {
    <span class="country-picker-placeholder">{{ placeholder }}</span>
    }
    <span class="country-picker-chevron" aria-hidden="true"></span>
  </button>

  <div #options class="country-picker-options" popover="auto" (toggle)="syncOpenState()">
    <input
      #searchInput
      class="country-picker-search"
      type="search"
      [placeholder]="mode === 'callingCode' ? 'Buscar país o código...' : 'Buscar país...'"
      [attr.aria-label]="'Buscar en ' + ariaLabel"
      [value]="searchTerm"
      (input)="updateSearch($event)">
    <div class="country-picker-list" role="listbox" [attr.aria-label]="ariaLabel">
    @for (country of filteredCountries; track country.code) {
    <button
      type="button"
      class="country-picker-option"
      role="option"
      [attr.aria-selected]="mode === 'callingCode' ? value === country.code : value === country.countryName"
      (click)="selectCountry(country)">
      <img [src]="'https://flagcdn.com/24x18/' + country.code.toLowerCase() + '.png'" [alt]="country.countryName" class="flag-icon" />
      <span>{{ mode === 'callingCode' ? country.callingCode : country.countryName }}</span>
    </button>
    } @empty {
    <p class="country-picker-empty" role="status">No se encontraron resultados.</p>
    }
    </div>
  </div>
</div>
