<ion-content [fullscreen]="true" class="home-content">
  <div class="home-container">
    <h1>Hospal PMS</h1>
    <p class="subtitle">Sistema de gestión hotelera</p>

    <ion-segment [(ngModel)]="authMode">
      <ion-segment-button value="login">
        <ion-label>Ingresar</ion-label>
      </ion-segment-button>
      <ion-segment-button value="register">
        <ion-label>Registrarse</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="auth-form">
      @if (authMode === 'register') {
        <ion-item lines="none">
          <ion-input label="Nombre" labelPlacement="stacked" placeholder="Tu nombre"></ion-input>
        </ion-item>
      }

      <ion-item lines="none">
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          type="email"
          placeholder="correo@ejemplo.com"
          [(ngModel)]="email"
        ></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="continue()">
        {{ authMode === 'login' ? 'Ingresar' : 'Crear cuenta' }}
      </ion-button>
    </div>
  </div>
</ion-content>
