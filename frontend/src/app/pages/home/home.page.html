<ion-content [fullscreen]="true" class="home-content">
  <div class="home-container">
    <h1>Hospal PMS</h1>
    <h2>Bienvenido al sistema de gestión hospitalaria</h2>
    <p class="subtitle">Por favor, ingresa tu correo y contraseña para continuar</p>

    <ion-segment [(ngModel)]="authMode">
      <ion-segment-button value="login">
        <ion-label>Ingresar</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="auth-form">

      <ion-item lines="none">
        <ion-input
          label="Correo electrónico"
          labelPlacement="stacked"
          type="email"
          placeholder="correo@ejemplo.com"
          [(ngModel)]="email"
        ></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          placeholder="••••••••"
          [(ngModel)]="password"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="continue()">
        {{ authMode === 'login' ? 'Ingresar' : 'Crear cuenta' }}
      </ion-button>
    </div>
  </div>
</ion-content>
