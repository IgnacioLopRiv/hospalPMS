<!-- Fondo invisible para capturar clics fuera de la pestaña y cerrarla -->
<div class="config-dropdown-backdrop" (click)="dismiss()"></div>

<!-- Pestaña de opciones ubicada bajo el header y a la derecha -->
<aside class="config-dropdown-tab" role="dialog" aria-label="Opciones de configuración">
  <nav class="tab-actions">
    @if (canManageUsers()) {
      <button type="button" class="action-btn" (click)="handleManageProfiles()">
        <div class="action-icon-box">
          <ion-icon name="people-outline"></ion-icon>
        </div>
        <span class="action-label">Gestionar perfiles</span>
      </button>

      <button type="button" class="action-btn" (click)="handlePosConfig()">
        <div class="action-icon-box">
          <ion-icon name="card-outline"></ion-icon>
        </div>
        <span class="action-label">Terminal de pago (POS)</span>
      </button>
    }
  </nav>
</aside>
