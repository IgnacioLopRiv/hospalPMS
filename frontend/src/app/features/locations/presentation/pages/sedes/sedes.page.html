<ion-content [fullscreen]="true" class="sedes-content">
  <div class="sedes-wrapper">
    <!-- Cabecera principal con Marca e Ícono -->
    <header class="sedes-header">
      <div class="brand-badge-header">
        <div class="header-icon-circle">
          <ion-icon name="business-outline"></ion-icon>
        </div>
        <div class="brand-title">
          <span class="brand-name">HosPal PMS</span>
          <span class="brand-tagline">Sistema de Gestión de Sedes</span>
        </div>
      </div>

      <h1>Selecciona una sede</h1>
      <p class="subtitle">Elige el establecimiento con el que deseas operar hoy</p>
    </header>

    <!-- Sección de botones / sedes -->
    <section class="sedes-card-box">
      <div class="box-legend">
        <span class="legend-badge">SEDES DISPONIBLES</span>
        <span class="legend-count">{{ sedes().length }} registradas</span>
      </div>

      <div class="sedes-grid">
        @for (sede of sedes(); track sede.id) {
          <button type="button" class="sede-btn-card" (click)="selectSede(sede)">
            <div class="card-icon-tag">
              <ion-icon name="business-outline"></ion-icon>
            </div>
            
            <div class="card-details">
              <h2>{{ sede.nombre }}</h2>
              <p>
                <ion-icon name="location-outline"></ion-icon>
                {{ sede.ciudad }}
              </p>
            </div>

            <div class="card-action">
              <span class="action-label">Ingresar</span>
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </div>
          </button>
        }
      </div>
    </section>
  </div>
</ion-content>
